# See architecture/standards/go-elemental/principles/release-and-ci.md
[settings]
task.run_auto_install = false

[tools]
"aqua:air-verse/air" = "1.67.4"
"aqua:google/go-containerregistry" = "0.22.1"
"github:standards-lab/claude-plugins" = { version = "0.24.1", version_prefix = "marathon/v" }
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"

[env]
MIKOSHI_ENV = "local"
GO_MODULES = "."

[tasks.check]
depends = ["client:build", "client:check"]
description = "Build and check the web client in web, then build, vet, format, fix, tidy, test the unit tier, and lint every module, vetting, fixing, and linting the integration suite too, then run lint-context and lint-references at the project root and, when the project is nested, at the git top level; writes nothing but the client's build, web/dist/"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -tags integration -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run --build-tags integration ./...
done
cd "$MISE_PROJECT_ROOT"
root=$(pwd -P)
top=$(git rev-parse --show-toplevel 2>/dev/null || echo "$root")
fail=0
for lint in lint-context lint-references; do
  if ! command -v "$lint" >/dev/null; then
    echo "FAIL: $lint is not on PATH; run mise install" >&2
    fail=1
    continue
  fi
  "$lint" || fail=1
  [ "$top" = "$root" ] || (cd "$top" && "$lint") || fail=1
done
exit "$fail"
'''

[tasks.currency]
description = "Report every mise tool, Go version, requirement, action pin, image tag, and Dockerfile source ARG behind its latest, a held one with its reason, running the script through bash since gonew drops its executable bit; writes nothing"
run = "bash scripts/currency.sh report"

[tasks.upgrade]
description = "Bump the mise tools, then each module's go directive (to the current Go minor, with no toolchain line) and direct requirements, with a tidy, then the action pins, image tags, Dockerfile FROM tags, and Dockerfile source ARGs, to their latest, but a held one; rewrites mise.toml, go.mod, go.sum, the workflows, and the compose files"
run = "bash scripts/currency.sh upgrade"

[tasks.build]
description = "Build the module"
run = "go build ./..."

[tasks.vet]
description = "Run go vet, the integration suite included"
run = "go vet -tags integration ./..."

[tasks.serve]
depends = ["client:build"]
description = "Run the service locally"
run = "go run ./cmd/server"

[tasks.test]
depends = ["client:build"]
description = "Run the unit tier"
run = "go test -race ./..."

[tasks.integration]
depends = ["client:build"]
description = "Start the isolated integration stack (PostgreSQL on tmpfs, on POSTGRES_PORT, default 5441), run the integration tier against the built service as a subprocess, print the stack's logs on a failure, and tear the stack down"
run = '''
set -e
export COMPOSE_PROJECT_NAME=mikoshi-integration COMPOSE_PROFILES=integration
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs; docker compose down; exit $rc' EXIT
docker compose up -d --wait --build postgres-integration
go test -race -count=1 -tags integration ./integration/
'''

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint, the integration suite included"
run = "golangci-lint run --build-tags integration ./..."

[tasks."db:up"]
description = "Build and start the development PostgreSQL (on POSTGRES_PORT, default 5440) and wait until it is healthy"
run = "docker compose up -d --wait --build"

[tasks."db:down"]
description = "Stop the development PostgreSQL, keeping its volume"
run = "docker compose down"

[tasks."db:reset"]
description = "Stop the development PostgreSQL and drop its volume"
run = "docker compose down -v"

[tasks."client:build"]
description = "Build the web client in web with its own mise run build"
run = "mise -C web run build"

[tasks."client:check"]
description = "Run the web client's own check in web, after its build"
depends = ["client:build"]
run = "mise -C web run check"

[tasks.dev]
description = "Run the dev loop: vite build --watch in web beside air, which rebuilds and restarts the server on each Go, JS, and CSS change (.air.toml)"
depends = ["client:build"]
run = """
set -e
trap 'kill 0' EXIT INT TERM
(mise -C web exec -- pnpm exec vite build --watch) &
air &
wait
"""
